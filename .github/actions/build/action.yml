name: 'Build image'
description: 'Build image for current machine architecture'
inputs:
  artifact_name:
    description: 'Name for GitHub Actions artifact upload.'
    default: 'artifact'
runs:
  using: "composite"
  steps:
    - name: Make the files in this commit available to the current directory
      uses: actions/checkout@v4
      with:
        path: ./repo/

    - name: Download required packages for build
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libguestfs-tools qemu-utils systemd-container


    - name: Build images
      id: build_images
      shell: bash
      run: sudo bash ./build.sh
      working-directory: ./repo/
      # creates files in: ./repo/build/

    - name: Pass image filename to other jobs
      id: list_images
      shell: bash
      run: |
        filename="$( find $path        \
                      -maxdepth 1      \
                      -type f          \
                      -printf '%f'   )"
        echo "filename=$filename" >> "$GITHUB_OUTPUT"
      env:
        path: ./repo/build
      # outputs:
      # filename

    - name: Pass artifacts to other jobs
      id: upload_artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: ./repo/build/${{ steps.list_images.outputs.filename }}
        retention-days: 1
      # outputs:
      # artifact-id
      # artifact-url
      # artifact-digest
outputs:
  filename: 
    description: 'Filename for the built image.'
    value: ${{ steps.list_images.outputs.filename }}
